version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/restreamer.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: restreamer
build:
  run_buildscript: false
images:
  # 上游 datarhei/restreamer 有完整三段 SemVer 家族（当前 2.12.0）→ stable + semver
  - id: restreamer
    target: service
    service: restreamer
    source: datarhei/restreamer
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Restreamer
    summary: "一个非常好且免费的直播流处理替代方案"
